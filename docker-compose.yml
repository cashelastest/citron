services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
      POSTGRES_DB: mini_ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d mini_ledger"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger_user:ledger_pass@db:5432/mini_ledger
      DEBUG: "false"
      FEE_PERCENT: "0.01"
    ports:
      - "8000:8000"
    depends_on:
      # Without this the container starts before Postgres accepts connections
      # and `alembic upgrade head` fails on the very first boot.
      db:
        condition: service_healthy

volumes:
  pgdata:
